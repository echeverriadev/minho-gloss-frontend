name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, formato, build, Storybook y specs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENSPEC_TELEMETRY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Formato (Prettier)
        run: npm run format:check
      - name: Tipos y build
        run: npm run build
      - name: Build de Storybook
        run: npm run build-storybook -- --quiet
      - name: Specs de OpenSpec
        run: npm run specs:validate
